<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="720" height="400" fill="#fff"/>
  <rect x="40" y="20" width="160" height="40" rx="6" fill="#e8f4fd" stroke="#2b7bb9"/><text x="120" y="45" text-anchor="middle" font-weight="600">Browser</text>
  <rect x="520" y="20" width="160" height="40" rx="6" fill="#e6f6f4" stroke="#0f766e"/><text x="600" y="45" text-anchor="middle" font-weight="600">Server</text>
  <line x1="120" y1="60" x2="120" y2="385" stroke="#999" stroke-dasharray="4 4"/>
  <line x1="600" y1="60" x2="600" y2="385" stroke="#999" stroke-dasharray="4 4"/>
  <rect x="610" y="300" width="100" height="70" rx="4" fill="#fff8e1" stroke="#c89b00"/>
  <text x="660" y="318" text-anchor="middle" font-size="12" font-weight="600">Session-Store</text>
  <text x="660" y="338" text-anchor="middle" font-size="11">a8F3…  → user 42</text>
  <text x="660" y="356" text-anchor="middle" font-size="11">läuft ab: 30 min</text>
  <line x1="120" y1="100" x2="598" y2="100" stroke="#333" marker-end="url(#a)"/>
  <text x="360" y="92" text-anchor="middle">① POST /login  (Benutzername + Passwort)</text>
  <text x="610" y="135" font-size="12" fill="#555">② prüft Passwort,</text>
  <text x="610" y="151" font-size="12" fill="#555">erzeugt Session-ID</text>
  <line x1="600" y1="180" x2="122" y2="180" stroke="#333" marker-end="url(#a)"/>
  <text x="360" y="172" text-anchor="middle">③ Set-Cookie: sid=a8F3…; HttpOnly; Secure; SameSite=Lax</text>
  <line x1="120" y1="250" x2="598" y2="250" stroke="#333" marker-end="url(#a)"/>
  <text x="360" y="242" text-anchor="middle">④ GET /orders   Cookie: sid=a8F3…  (automatisch)</text>
  <line x1="600" y1="320" x2="122" y2="320" stroke="#333" marker-end="url(#a)"/>
  <text x="360" y="312" text-anchor="middle">⑤ Antwort für user 42</text>
  <text x="130" y="355" font-size="12" fill="#555">Der Browser speichert nur die ID,</text>
  <text x="130" y="371" font-size="12" fill="#555">die Daten liegen am Server.</text>
</svg>
