<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
  <rect width="720" height="330" fill="#fff"/>
  <rect x="30" y="20" width="170" height="48" rx="6" fill="#fff5f5" stroke="#c92a2a"/><text x="115" y="41" text-anchor="middle" font-weight="600">böse Seite</text><text x="115" y="58" text-anchor="middle" font-size="11">evil.example</text>
  <rect x="275" y="20" width="170" height="48" rx="6" fill="#e8f4fd" stroke="#2b7bb9"/><text x="360" y="41" text-anchor="middle" font-weight="600">Browser des Opfers</text><text x="360" y="58" text-anchor="middle" font-size="11">bei der Bank eingeloggt</text>
  <rect x="520" y="20" width="170" height="48" rx="6" fill="#e6f6f4" stroke="#0f766e"/><text x="605" y="41" text-anchor="middle" font-weight="600">Bank</text><text x="605" y="58" text-anchor="middle" font-size="11">bank.example</text>
  <g stroke="#999" stroke-dasharray="4 4"><line x1="115" y1="68" x2="115" y2="315"/><line x1="360" y1="68" x2="360" y2="315"/><line x1="605" y1="68" x2="605" y2="315"/></g>
  <line x1="360" y1="110" x2="117" y2="110" stroke="#333" marker-end="url(#a)"/>
  <text x="238" y="102" text-anchor="middle">① Opfer öffnet evil.example</text>
  <line x1="115" y1="165" x2="358" y2="165" stroke="#333" marker-end="url(#a)"/>
  <text x="238" y="142" text-anchor="middle">② Seite enthält verstecktes,</text>
  <text x="238" y="157" text-anchor="middle" font-size="11">automatisch abgeschicktes Formular</text>
  <line x1="360" y1="225" x2="603" y2="225" stroke="#c92a2a" stroke-width="2" marker-end="url(#r)"/>
  <text x="482" y="205" text-anchor="middle" fill="#c92a2a">③ POST /transfer  (an Angreifer, 1000 €)</text>
  <text x="482" y="218" text-anchor="middle" font-size="11" fill="#c92a2a">Browser hängt das Session-Cookie automatisch an</text>
  <text x="595" y="265" font-size="12" fill="#555" text-anchor="end">④ gültige Session →</text>
  <text x="595" y="281" font-size="12" fill="#555" text-anchor="end">Überweisung wird</text>
  <text x="595" y="297" font-size="12" fill="#555" text-anchor="end">ausgeführt</text>
</svg>
