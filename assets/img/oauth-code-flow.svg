<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="760" height="470" fill="#fff"/>
  <rect x="10" y="15" width="140" height="48" rx="6" fill="#f1f3f5" stroke="#495057"/><text x="80" y="36" text-anchor="middle" font-weight="600">Benutzer</text><text x="80" y="53" text-anchor="middle" font-size="11">(Resource Owner)</text>
  <rect x="200" y="15" width="150" height="48" rx="6" fill="#e8f4fd" stroke="#2b7bb9"/><text x="275" y="36" text-anchor="middle" font-weight="600">Web-App</text><text x="275" y="53" text-anchor="middle" font-size="11">(Client)</text>
  <rect x="400" y="15" width="170" height="48" rx="6" fill="#e6f6f4" stroke="#0f766e"/><text x="485" y="36" text-anchor="middle" font-weight="600">Authorization Server</text><text x="485" y="53" text-anchor="middle" font-size="11">(z. B. Google, Keycloak)</text>
  <rect x="610" y="15" width="140" height="48" rx="6" fill="#fff8e1" stroke="#c89b00"/><text x="680" y="36" text-anchor="middle" font-weight="600">Resource Server</text><text x="680" y="53" text-anchor="middle" font-size="11">(API)</text>
  <g stroke="#999" stroke-dasharray="4 4"><line x1="80" y1="63" x2="80" y2="455"/><line x1="275" y1="63" x2="275" y2="455"/><line x1="485" y1="63" x2="485" y2="455"/><line x1="680" y1="63" x2="680" y2="455"/></g>
  <g stroke="#333" fill="none">
    <line x1="80" y1="100" x2="273" y2="100" marker-end="url(#a)"/>
    <line x1="275" y1="145" x2="483" y2="145" marker-end="url(#a)"/>
    <line x1="80" y1="195" x2="483" y2="195" marker-end="url(#a)"/>
    <line x1="485" y1="245" x2="277" y2="245" marker-end="url(#a)"/>
    <line x1="275" y1="300" x2="483" y2="300" marker-end="url(#a)"/>
    <line x1="485" y1="345" x2="277" y2="345" marker-end="url(#a)"/>
    <line x1="275" y1="405" x2="678" y2="405" marker-end="url(#a)"/>
  </g>
  <text x="177" y="93" text-anchor="middle">① „Login mit …“</text>
  <text x="380" y="122" text-anchor="middle">② Weiterleitung: client_id, scope,</text>
  <text x="380" y="137" text-anchor="middle" font-size="11">redirect_uri, state, code_challenge (PKCE)</text>
  <text x="282" y="188" text-anchor="middle">③ Benutzer meldet sich an und stimmt zu (Consent)</text>
  <text x="380" y="238" text-anchor="middle">④ Redirect zur App mit Authorization Code</text>
  <text x="380" y="277" text-anchor="middle">⑤ Code + code_verifier gegen Tokens</text>
  <text x="380" y="292" text-anchor="middle" font-size="11">tauschen (Back-Channel)</text>
  <text x="380" y="338" text-anchor="middle">⑥ Access Token (+ ID Token, Refresh Token)</text>
  <text x="478" y="398" text-anchor="middle">⑦ API-Aufruf mit Authorization: Bearer &lt;Access Token&gt;</text>
  <text x="290" y="440" font-size="11" fill="#555">Das Passwort sieht nur der Authorization Server – nie die Web-App.</text>
</svg>
